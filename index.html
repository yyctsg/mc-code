<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINECRAFT JOIN CODE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #2c2d30 0%, #121316 100%);
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #f0f0f0;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }
    .code-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px;
    }
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 16px 36px rgba(0,0,0,0.6);
    }
    .card img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .admin-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e0e0e0;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .admin-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: #1a1b1e;
      padding: 30px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 320px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-content h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #ffffff;
    }
    .modal-content input {
      padding: 10px 12px;
      background: #121316;
      border: 1px solid #2e3035;
      color: #ffffff;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .modal-content input:focus {
      border-color: #4f46e5;
    }
    .modal-content button {
      padding: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s ease;
      margin-top: 4px;
    }
    .modal-content button:hover {
      background: #2563eb;
    }
    .btn-cancel {
      background: #ef4444 !important;
    }
    .btn-cancel:hover {
      background: #dc2626 !important;
    }
  </style>
</head>
<body>

  <button class="admin-btn" onclick="openAdmin()">⚙️ Admin</button>
  <h1>MINECRAFT JOIN CODE</h1>
  <div class="code-container" id="join-code"></div>

  <div class="modal" id="admin-modal">
    <div class="modal-content">
      <h2>Update Join Code</h2>
      <input type="text" id="icon1" placeholder="Icon 1 (e.g. Apple)">
      <input type="text" id="icon2" placeholder="Icon 2 (e.g. Water Bucket)">
      <input type="text" id="icon3" placeholder="Icon 3 (e.g. Iron Pickaxe)">
      <input type="text" id="icon4" placeholder="Icon 4 (e.g. Book and Quill)">
      <input type="password" id="admin-pass" placeholder="Enter PIN">
      <button onclick="verifyAndSave()">Save Code</button>
      <button onclick="closeAdmin()" class="btn-cancel">Cancel</button>
    </div>
  </div>

  <script>
    const PASSCODE = "1234";

    let todayCode = JSON.parse(localStorage.getItem('mcCode')) || ["Apple", "Map", "Potion", "Sign"];

    function renderCode() {
      const container = document.getElementById("join-code");
      container.innerHTML = "";
      todayCode.forEach(iconName => {
        container.innerHTML += `
          <div class="card">
            <img src="${iconName}.png" alt="${iconName}" onerror="this.onerror=null; this.src='Agent.png';">
          </div>
        `;
      });
    }

    function openAdmin() {
      document.getElementById("icon1").value = todayCode[0] || "";
      document.getElementById("icon2").value = todayCode[1] || "";
      document.getElementById("icon3").value = todayCode[2] || "";
      document.getElementById("icon4").value = todayCode[3] || "";
      document.getElementById("admin-pass").value = "";
      document.getElementById("admin-modal").style.display = "flex";
    }

    function closeAdmin() {
      document.getElementById("admin-modal").style.display = "none";
    }

    function verifyAndSave() {
      const inputPass = document.getElementById("admin-pass").value;
      if (inputPass === PASSCODE) {
        todayCode = [
          document.getElementById("icon1").value.trim(),
          document.getElementById("icon2").value.trim(),
          document.getElementById("icon3").value.trim(),
          document.getElementById("icon4").value.trim()
        ];
        localStorage.setItem('mcCode', JSON.stringify(todayCode));
        renderCode();
        closeAdmin();
      } else {
        alert("Incorrect passcode!");
      }
    }

    renderCode();
  </script>

</body>
</html>
