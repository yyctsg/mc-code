<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINECRAFT JOIN CODE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #1b2838 0%, #0d121a 100%);
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    /* Pixel background grid */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
    }
    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1.1rem, 4vw, 1.8rem);
      line-height: 1.5;
      margin-bottom: 30px;
      text-align: center;
      text-transform: uppercase;
      color: #55ff55;
      text-shadow: 3px 3px 0px #00aa00, 0 0 20px rgba(85, 255, 85, 0.4);
      letter-spacing: 1px;
      z-index: 1;
    }
    .code-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      max-width: 900px;
      width: 100%;
      padding: 10px;
      z-index: 1;
    }
    .card {
      background: rgba(20, 25, 35, 0.6);
      border: 2px solid rgba(85, 255, 85, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      width: 140px;
      height: 140px;
    }
    .card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: rgba(85, 255, 85, 0.8);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(85, 255, 85, 0.2);
    }
    .card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5));
    }
    .admin-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #bbbbbb;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      z-index: 10;
    }
    .admin-btn:hover {
      background: rgba(85, 255, 85, 0.15);
      color: #55ff55;
      border-color: rgba(85, 255, 85, 0.5);
      box-shadow: 0 0 15px rgba(85, 255, 85, 0.2);
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 12, 0.85);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-content {
      background: #121824;
      padding: 28px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 0, 0, 0.5);
    }
    .modal-content h2 {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .modal-content input {
      padding: 12px 14px;
      background: #0a0d14;
      border: 1px solid #222c3d;
      color: #ffffff;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .modal-content input:focus {
      border-color: #55ff55;
      box-shadow: 0 0 10px rgba(85, 255, 85, 0.2);
    }
    .modal-content button {
      padding: 12px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      margin-top: 4px;
    }
    .modal-content button:hover {
      background: #388e3c;
      box-shadow: 0 0 15px rgba(56, 142, 60, 0.4);
    }
    .btn-cancel {
      background: #c62828 !important;
    }
    .btn-cancel:hover {
      background: #d32f2f !important;
      box-shadow: 0 0 15px rgba(211, 47, 47, 0.4) !important;
    }

    /* Mobile Responsive Tweaks */
    @media (max-width: 600px) {
      .admin-btn {
        top: 15px;
        right: 15px;
      }
      .code-container {
        gap: 12px;
      }
      .card {
        width: 120px;
        height: 120px;
        padding: 12px;
      }
      .card img {
        width: 64px;
        height: 64px;
      }
    }
  </style>
</head>
<body>

  <button class="admin-btn" onclick="openAdmin()">⚙️ Admin</button>
  <h1>MINECRAFT JOIN CODE</h1>
  <div class="code-container" id="join-code"></div>

  <div class="modal" id="admin-modal">
    <div class="modal-content">
      <h2>Update Join Code</h2>
      <input type="text" id="icon1" placeholder="Icon 1 (e.g. Apple)">
      <input type="text" id="icon2" placeholder="Icon 2 (e.g. Map)">
      <input type="text" id="icon3" placeholder="Icon 3 (e.g. Potion)">
      <input type="text" id="icon4" placeholder="Icon 4 (e.g. Sign)">
      <input type="password" id="admin-pass" placeholder="Enter PIN">
      <button onclick="verifyAndSave()">Save Code</button>
      <button onclick="closeAdmin()" class="btn-cancel">Cancel</button>
    </div>
  </div>

  <script>
    // SHA-256 Hash for "VOLTRONTECH"
    const PASSCODE_HASH = "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4";

    let todayCode = JSON.parse(localStorage.getItem('mcCode')) || ["Apple", "Map", "Potion", "Sign"];

    async function hashString(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function renderCode() {
      const container = document.getElementById("join-code");
      container.innerHTML = "";
      todayCode.forEach(iconName => {
        container.innerHTML += `
          <div class="card">
            <img src="${iconName}.png" alt="${iconName}" onerror="this.onerror=null; this.src='Agent.png';">
          </div>
        `;
      });
    }

    function openAdmin() {
      document.getElementById("icon1").value = todayCode[0] || "";
      document.getElementById("icon2").value = todayCode[1] || "";
      document.getElementById("icon3").value = todayCode[2] || "";
      document.getElementById("icon4").value = todayCode[3] || "";
      document.getElementById("admin-pass").value = "";
      document.getElementById("admin-modal").style.display = "flex";
    }

    function closeAdmin() {
      document.getElementById("admin-modal").style.display = "none";
    }

    async function verifyAndSave() {
      const inputPass = document.getElementById("admin-pass").value;
      const inputHash = await hashString(inputPass);

      if (inputHash === PASSCODE_HASH) {
        todayCode = [
          document.getElementById("icon1").value.trim(),
          document.getElementById("icon2").value.trim(),
          document.getElementById("icon3").value.trim(),
          document.getElementById("icon4").value.trim()
        ];
        localStorage.setItem('mcCode', JSON.stringify(todayCode));
        renderCode();
        closeAdmin();
      } else {
        alert("Incorrect passcode!");
      }
    }

    renderCode();
  </script>

</body>
</html>
