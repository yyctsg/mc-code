<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft World Join Code</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .code-container {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: #2a2a2a;
      border: 3px solid #4a4a4a;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    .card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

  <h1>Today's Join Code</h1>
  <div class="code-container" id="join-code"></div>

  <script>
    // UPDATE THESE 4 NAMES TO MATCH YOUR PNG FILE NAMES EXACTLY!
    const todayCode = ["apple", "book", "cookie", "water"];

    const container = document.getElementById("join-code");
    todayCode.forEach(iconName => {
      container.innerHTML += `
        <div class="card">
          <img src="${iconName}.png" alt="${iconName}">
        </div>
      `;
    });
  </script>

</body>
</html>
