<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINECRAFT JOIN CODE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0b0f19;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(34, 197, 94, 0.15) 0%, transparent 65%),
        radial-gradient(circle at 50% 100%, rgba(15, 23, 42, 0.8) 0%, transparent 100%);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle Pixel Grid */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1.1rem, 3.5vw, 1.8rem);
      line-height: 1.5;
      text-align: center;
      color: #4ade80;
      text-shadow: 0 0 25px rgba(74, 222, 128, 0.25);
      margin-bottom: 36px;
      letter-spacing: 0.5px;
      z-index: 1;
    }

    .code-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      max-width: 900px;
      width: 100%;
      padding: 10px;
      z-index: 1;
    }

    /* Modern Glass Cards */
    .card {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      width: 140px;
      height: 140px;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(74, 222, 128, 0.4);
      background: rgba(20, 30, 50, 0.7);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(74, 222, 128, 0.15);
    }

    .card img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5));
    }

    .admin-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      z-index: 10;
    }

    .admin-btn:hover {
      background: rgba(74, 222, 128, 0.1);
      color: #4ade80;
      border-color: rgba(74, 222, 128, 0.3);
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: #0f172a;
      padding: 28px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
    }

    .modal-header h2 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .modal-header p {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 4px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-content input {
      padding: 12px 14px;
      background: #020617;
      border: 1px solid #1e293b;
      color: #ffffff;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      transition: all 0.2s ease;
    }

    .modal-content input:focus {
      border-color: #4ade80;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.15);
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-primary {
      padding: 12px;
      background: #22c55e;
      color: #022c22;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: #4ade80;
      box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
    }

    .btn-cancel {
      padding: 10px;
      background: transparent;
      color: #64748b;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .btn-cancel:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.08);
    }

    @media (max-width: 600px) {
      .admin-btn { top: 16px; right: 16px; }
      .code-container { gap: 14px; }
      .card { width: 120px; height: 120px; padding: 14px; }
      .card img { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>

  <button class="admin-btn" onclick="openAdminModal()">⚙️ Admin</button>

  <h1>MINECRAFT JOIN CODE</h1>

  <div class="code-container" id="join-code"></div>

  <!-- Admin Modal -->
  <div class="modal" id="admin-modal">
    <div class="modal-content">
      
      <!-- STEP 1: Enter PIN -->
      <div id="step-pin">
        <div class="modal-header">
          <h2>Admin Access</h2>
          <p>Enter your PIN to edit the code</p>
        </div>
        <div class="input-group" style="margin-top: 14px;">
          <input type="password" id="admin-pin" placeholder="Enter PIN">
        </div>
        <div class="modal-actions">
          <button class="btn-primary" onclick="verifyPin()">Unlock</button>
          <button class="btn-cancel" onclick="closeAdminModal()">Cancel</button>
        </div>
      </div>

      <!-- STEP 2: Edit Symbols -->
      <div id="step-edit" style="display: none;">
        <div class="modal-header">
          <h2>Update Icons</h2>
          <p>Enter image filenames</p>
        </div>
        <div class="input-group" style="margin-top: 14px;">
          <input type="text" id="icon1" placeholder="Icon 1">
          <input type="text" id="icon2" placeholder="Icon 2">
          <input type="text" id="icon3" placeholder="Icon 3">
          <input type="text" id="icon4" placeholder="Icon 4">
        </div>
        <div class="modal-actions">
          <button class="btn-primary" onclick="saveSymbols()">Save Changes</button>
          <button class="btn-cancel" onclick="closeAdminModal()">Cancel</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const PASSCODE = "bignuhtesh67";
    let todayCode = JSON.parse(localStorage.getItem('mcCode')) || ["Apple", "Map", "Potion", "Sign"];

    function renderCode() {
      const container = document.getElementById("join-code");
      container.innerHTML = "";
      const cacheBuster = Date.now();
      todayCode.forEach(iconName => {
        container.innerHTML += `
          <div class="card">
            <img src="${iconName}.png?v=${cacheBuster}" alt="${iconName}" onerror="this.onerror=null; this.src='Agent.png';">
          </div>
        `;
      });
    }

    function openAdminModal() {
      document.getElementById("step-pin").style.display = "block";
      document.getElementById("step-edit").style.display = "none";
      document.getElementById("admin-pin").value = "";
      document.getElementById("admin-modal").style.display = "flex";
    }

    function closeAdminModal() {
      document.getElementById("admin-modal").style.display = "none";
    }

    function verifyPin() {
      const inputPin = document.getElementById("admin-pin").value;
      if (inputPin === PASSCODE) {
        document.getElementById("icon1").value = todayCode[0] || "";
        document.getElementById("icon2").value = todayCode[1] || "";
        document.getElementById("icon3").value = todayCode[2] || "";
        document.getElementById("icon4").value = todayCode[3] || "";

        document.getElementById("step-pin").style.display = "none";
        document.getElementById("step-edit").style.display = "block";
      } else {
        alert("Incorrect PIN!");
      }
    }

    function saveSymbols() {
      todayCode = [
        document.getElementById("icon1").value.trim(),
        document.getElementById("icon2").value.trim(),
        document.getElementById("icon3").value.trim(),
        document.getElementById("icon4").value.trim()
      ];
      localStorage.setItem('mcCode', JSON.stringify(todayCode));
      renderCode();
      closeAdminModal();
    }

    renderCode();
  </script>

</body>
</html>
