<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINECRAFT JOIN CODE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #080c14;
      background-image: 
        radial-gradient(circle at 50% 40%, rgba(30, 90, 50, 0.25) 0%, transparent 70%),
        radial-gradient(circle at 50% 100%, rgba(10, 20, 35, 0.8) 0%, transparent 100%);
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle Pixel Grid */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(85, 255, 85, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(85, 255, 85, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    h1 {
      font-size: clamp(1.1rem, 4vw, 2rem);
      line-height: 1.6;
      text-align: center;
      color: #55ff55;
      text-shadow: 0 0 20px rgba(85, 255, 85, 0.4), 3px 3px 0px #00aa00;
      margin-bottom: 40px;
      letter-spacing: 1px;
      z-index: 1;
    }

    .code-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      max-width: 900px;
      width: 100%;
      padding: 10px;
      z-index: 1;
    }

    /* Refined Glass Cards */
    .card {
      background: rgba(15, 23, 36, 0.45);
      border: 2px solid rgba(85, 255, 85, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(85, 255, 85, 0.05);
      transition: all 0.25s ease;
      width: 140px;
      height: 140px;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: #55ff55;
      background: rgba(20, 32, 48, 0.6);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(85, 255, 85, 0.3);
    }

    .card img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.7));
    }

    .admin-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(15, 23, 36, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.15);
      color: #aaaaaa;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      z-index: 10;
    }

    .admin-btn:hover {
      background: rgba(85, 255, 85, 0.15);
      color: #55ff55;
      border-color: #55ff55;
      box-shadow: 0 0 15px rgba(85, 255, 85, 0.3);
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 12, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: rgba(15, 23, 36, 0.95);
      padding: 28px;
      border-radius: 16px;
      border: 2px solid rgba(85, 255, 85, 0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(85, 255, 85, 0.2);
    }

    .modal-header h2 {
      font-size: 0.85rem;
      color: #55ff55;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .modal-header p {
      font-size: 0.55rem;
      color: #888888;
      margin-top: 8px;
      line-height: 1.5;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content input {
      padding: 12px;
      background: rgba(5, 9, 15, 0.8);
      border: 2px solid #1e293b;
      color: #ffffff;
      border-radius: 8px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .modal-content input:focus {
      border-color: #55ff55;
      box-shadow: 0 0 12px rgba(85, 255, 85, 0.3);
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-primary {
      padding: 12px;
      background: #2e7d32;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 #1b5e20;
    }

    .btn-primary:hover {
      background: #388e3c;
      box-shadow: 0 4px 0 #1b5e20, 0 0 15px rgba(85, 255, 85, 0.4);
    }

    .btn-primary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1b5e20;
    }

    .btn-cancel {
      padding: 10px;
      background: transparent;
      color: #888888;
      border: none;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      transition: all 0.2s ease;
    }

    .btn-cancel:hover {
      color: #ff5555;
    }

    @media (max-width: 600px) {
      .admin-btn { top: 16px; right: 16px; }
      .code-container { gap: 14px; }
      .card { width: 120px; height: 120px; padding: 14px; }
      .card img { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>

  <button class="admin-btn" onclick="openAdminModal()">⚙ ADMIN</button>

  <h1>MINECRAFT JOIN CODE</h1>

  <div class="code-container" id="join-code"></div>

  <!-- Admin Modal -->
  <div class="modal" id="admin-modal">
    <div class="modal-content">
      
      <!-- STEP 1: Enter PIN -->
      <div id="step-pin">
        <div class="modal-header">
          <h2>ADMIN ACCESS</h2>
          <p>ENTER PIN TO EDIT CODE</p>
        </div>
        <div class="input-group" style="margin-top: 16px;">
          <input type="password" id="admin-pin" placeholder="PIN">
        </div>
        <div class="modal-actions">
          <button class="btn-primary" onclick="verifyPin()">UNLOCK</button>
          <button class="btn-cancel" onclick="closeAdminModal()">CANCEL</button>
        </div>
      </div>

      <!-- STEP 2: Edit Symbols -->
      <div id="step-edit" style="display: none;">
        <div class="modal-header">
          <h2>UPDATE ICONS</h2>
          <p>ENTER IMAGE FILENAMES</p>
        </div>
        <div class="input-group" style="margin-top: 14px;">
          <input type="text" id="icon1" placeholder="ICON 1">
          <input type="text" id="icon2" placeholder="ICON 2">
          <input type="text" id="icon3" placeholder="ICON 3">
          <input type="text" id="icon4" placeholder="ICON 4">
        </div>
        <div class="modal-actions">
          <button class="btn-primary" onclick="saveSymbols()">SAVE</button>
          <button class="btn-cancel" onclick="closeAdminModal()">CANCEL</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const PASSCODE = "bignuhtesh67";
    let todayCode = JSON.parse(localStorage.getItem('mcCode')) || ["Apple", "Map", "Potion", "Sign"];

    function renderCode() {
      const container = document.getElementById("join-code");
      container.innerHTML = "";
      todayCode.forEach(iconName => {
        container.innerHTML += `
          <div class="card">
            <img src="${iconName}.png" alt="${iconName}" onerror="this.onerror=null; this.src='Agent.png';">
          </div>
        `;
      });
    }

    function openAdminModal() {
      document.getElementById("step-pin").style.display = "block";
      document.getElementById("step-edit").style.display = "none";
      document.getElementById("admin-pin").value = "";
      document.getElementById("admin-modal").style.display = "flex";
    }

    function closeAdminModal() {
      document.getElementById("admin-modal").style.display = "none";
    }

    function verifyPin() {
      const inputPin = document.getElementById("admin-pin").value;
      if (inputPin === PASSCODE) {
        document.getElementById("icon1").value = todayCode[0] || "";
        document.getElementById("icon2").value = todayCode[1] || "";
        document.getElementById("icon3").value = todayCode[2] || "";
        document.getElementById("icon4").value = todayCode[3] || "";

        document.getElementById("step-pin").style.display = "none";
        document.getElementById("step-edit").style.display = "block";
      } else {
        alert("INCORRECT PIN!");
      }
    }

    function saveSymbols() {
      todayCode = [
        document.getElementById("icon1").value.trim(),
        document.getElementById("icon2").value.trim(),
        document.getElementById("icon3").value.trim(),
        document.getElementById("icon4").value.trim()
      ];
      localStorage.setItem('mcCode', JSON.stringify(todayCode));
      renderCode();
      closeAdminModal();
    }

    renderCode();
  </script>

</body>
</html>
